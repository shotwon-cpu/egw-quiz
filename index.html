<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가려뽑은기별 1권 골든벨 퀴즈</title>
  <style>
    :root {
      --primary-color: #2b5a84;
      --primary-hover: #1e3f5d;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --correct-color: #2e7d32;
      --incorrect-color: #c62828;
      --timer-color: #e65100;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #eaeff3;
      padding-bottom: 16px;
    }
    h1 { font-size: 1.4rem; color: var(--primary-color); word-break: keep-all; }
    p.subtitle { font-size: 0.85rem; color: #666; margin-top: 4px; }
    
    /* 설정 박스 (타이머 토글 및 주관식 모드 선택) */
    .settings-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.9rem;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .toggle-switch input {
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: var(--primary-color);
    }
    .mode-select-group {
      display: flex;
      gap: 12px;
    }
    .mode-radio-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    /* 퀴즈 네비게이션 상단바 */
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .nav-btn {
      background: #eef3f8;
      border: 1px solid #d0dbe5;
      color: var(--primary-color);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(43, 90, 132, 0.25);
    }

    /* 타이머 바 */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--timer-color);
      margin-bottom: 8px;
    }
    .timer-bar-bg {
      flex: 1;
      height: 6px;
      background: #ffe0b2;
      border-radius: 3px;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      background: var(--timer-color);
      width: 100%;
      transition: width 1s linear;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      margin: 8px 0;
      background: #ffffff;
      border: 1.5px solid #d0d7de;
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
    }
    .btn:hover {
      border-color: var(--primary-color);
      background-color: #f0f4f8;
    }
    .btn-primary {
      background: var(--primary-color);
      color: white;
      text-align: center;
      border: none;
      font-weight: bold;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      text-align: center;
      border: 1.5px solid #cbd5e1;
      font-weight: 600;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .btn-danger {
      background: #fff5f5;
      color: var(--incorrect-color);
      text-align: center;
      border: 1.5px solid #ffcdd2;
      font-weight: 600;
    }
    .btn-danger:hover {
      background: #ffebee;
    }
    
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      word-break: keep-all;
    }
    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--correct-color) !important;
      color: var(--correct-color) !important;
      font-weight: bold;
    }
    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--incorrect-color) !important;
      color: var(--incorrect-color) !important;
    }

    /* 주관식 단답형 인풋 스타일 */
    .short-input-box {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    .short-input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .short-input:focus {
      border-color: var(--primary-color);
    }
    .short-submit-btn {
      width: 90px;
      margin: 0;
      padding: 12px;
    }
    
    .explanation-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #f8f9fa;
      border-left: 4px solid var(--primary-color);
      font-size: 0.9rem;
      display: none;
      word-break: keep-all;
      white-space: pre-line;
    }
    
    .hidden { display: none !important; }
    
    .result-box {
      text-align: center;
      padding: 10px 0;
    }
    .score-num {
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--primary-color);
      margin: 10px 0;
    }
    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .review-item {
      text-align: left;
      border-top: 1px solid #e2e8f0;
      padding: 14px 0;
      font-size: 0.9rem;
    }
    .review-q {
      font-weight: bold;
      margin-bottom: 6px;
    }
    .review-ans {
      color: var(--correct-color);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .review-exp {
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>가려뽑은기별 1권 골든벨 퀴즈</h1>
      <p class="subtitle">목차별 세부 학습 및 실전 연습</p>
    </header>

    <!-- 1. 목차 선택 화면 -->
    <div id="chapter-screen">
      <div class="settings-panel">
        <div class="setting-row">
          <span>🎯 <strong>문제 유형 선택</strong></span>
          <div class="mode-select-group">
            <label class="mode-radio-label">
              <input type="radio" name="quiz-type" value="multiple" checked> 객관식
            </label>
            <label class="mode-radio-label">
              <input type="radio" name="quiz-type" value="short"> 주관식(단답형)
            </label>
          </div>
        </div>
        <div class="setting-row">
          <span>⚡ <strong>초읽기 타이머 (15초)</strong></span>
          <label class="toggle-switch">
            <input type="checkbox" id="timer-toggle">
            <span>사용</span>
          </label>
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <button id="stored-wrong-btn" onclick="startStoredWrongQuiz()" class="btn btn-danger hidden" style="text-align: center;">
          📑 누적 오답 보관함 풀기 (<span id="stored-wrong-count">0</span>문항)
        </button>
      </div>

      <h2 style="font-size: 1.05rem; margin-bottom: 12px;">풀고 싶은 장을 선택하세요:</h2>
      <div id="chapter-list"></div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-nav">
        <button class="nav-btn" onclick="confirmExitToChapter()">
          ← 목차로 나가기
        </button>
        <span id="quiz-mode-badge" style="font-size: 0.8rem; color: #64748b; font-weight: 600;">일반 풀이</span>
      </div>

      <div id="timer-ui" class="timer-container hidden">
        <span>⏳ 남은 시간: <span id="timer-num">15</span>초</span>
        <div class="timer-bar-bg">
          <div id="timer-bar-fill" class="timer-bar-fill"></div>
        </div>
      </div>

      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="question-number" style="font-size: 0.85rem; color: #666; margin-bottom: 8px;"></div>
      <div id="question-text" class="question-title"></div>
      
      <!-- 객관식 보기 영역 -->
      <div id="options-container"></div>
      
      <!-- 주관식 입력 영역 -->
      <div id="short-answer-container" class="hidden">
        <div class="short-input-box">
          <input type="text" id="short-answer-input" class="short-input" placeholder="정답 키워드를 입력하세요" autocomplete="off">
          <button id="short-submit-btn" class="btn btn-primary short-submit-btn" onclick="submitShortAnswer()">제출</button>
        </div>
      </div>

      <div id="explanation-box" class="explanation-box"></div>
      <button id="next-btn" class="btn btn-primary hidden" style="margin-top: 16px;">다음 문제</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="result-box">
        <h2>퀴즈 완료!</h2>
        <div id="score-text" class="score-num">0 / 0</div>
        <p id="result-msg" style="margin-bottom: 16px;"></p>
        
        <div class="result-actions">
          <button id="retry-wrong-btn" onclick="startWrongOnlyQuiz()" class="btn btn-danger hidden">방금 틀린 문제 다시 풀기</button>
          <button onclick="retryCurrentQuiz()" class="btn btn-secondary">현재 모드로 다시 풀기 (셔플)</button>
          <button id="toggle-review-btn" onclick="toggleWrongReview()" class="btn btn-secondary hidden">오답 노트 확인하기</button>
          <button onclick="showChapterScreen()" class="btn btn-primary">목차 화면으로 이동</button>
        </div>

        <div id="review-container" class="hidden" style="margin-top: 24px; text-align: left;">
          <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--incorrect-color);">틀린 문제 해설 목록</h3>
          <div id="review-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const quizData = {
      "ch1": {
        title: "제1장: 우리 길에 비취는 빛",
        questions: [
          {
            id: "ch1_1",
            q: "성경의 영감 방식에 대해 엘렌 화잇은 단어가 아닌 어디에 영감이 임했다고 설명합니까?",
            options: [
              "하나님께서 단어 하나하나를 기계적으로 받아 적게 하셨다.",
              "하나님께서 저자 자신에게 영감을 주셨고, 저자가 자신의 언어로 사상을 표현했다.",
              "성경 저자들은 자신만의 사상을 자의적으로 기록했다.",
              "성경에는 영감되지 않은 부분이 있으므로 인간이 가려내야 한다."
            ],
            answer: 1,
            shortAnswers: ["저자", "사람", "저자자신", "사람자체", "사상"],
            displayAnswer: "저자 자신 (사람 자체)",
            explanation: "해설: 영감은 인간의 단어나 표현에 임하는 것이 아니라 사람 자체(저자)에게 임하여 사상을 주시고, 저자가 자신의 언어로 표현하게 하신 것입니다."
          },
          {
            id: "ch1_2",
            q: "성경 전체 중 유일하게 하나님께서 친히 음성으로 말씀하시고 친수(親手)로 돌판에 기록하신 것은 무엇입니까?",
            options: [
              "창세기의 창조 기록",
              "의문의 율법(제사법)",
              "십계명",
              "산상보훈"
            ],
            answer: 2,
            shortAnswers: ["십계명", "도덕법", "십계명의도덕법"],
            displayAnswer: "십계명",
            explanation: "해설: 십계명은 성경에서 유일하게 하나님께서 인간 대리자를 거치지 않고 직접 말씀하시고 친수로 돌판에 기록하신 말씀입니다."
          },
          {
            id: "ch1_3",
            q: "화잇 여사가 자신을 가리켜 '선지자'라는 칭호 대신 주로 사용했던 직함은 무엇입니까?",
            options: [
              "교단의 대표 자격자",
              "주님의 사자 (Messenger of the Lord)",
              "교회 행정 대변인",
              "특별 사도"
            ],
            answer: 1,
            shortAnswers: ["주님의 사자", "주님의사자", "주의 사자", "주의사자", "Messenger of the Lord"],
            displayAnswer: "주님의 사자 (Messenger of the Lord)",
            explanation: "해설: 화잇 여사는 자신에 대해 '주님의 사자'라는 표현을 사용하였으며, 이는 선지자라는 말보다 더 광범위한 사명을 포함한다고 설명했습니다."
          },
          {
            id: "ch1_4",
            q: "성경에 나타난 인간 언어의 특성상, 하나님의 무한한 사상을 표현할 때 가지는 한계는 무엇입니까?",
            options: [
              "유한한 인간의 언어로 하나님의 위대한 사상을 완전하게 다 표현할 수 없다.",
              "오류가 많아 성경의 권위를 인정할 수 없다.",
              "인간 저자들의 언어 수준이 낮아 진리가 오염되었다.",
              "단어 자체가 하늘 언어로 직역되어 결함이 없다."
            ],
            answer: 0,
            shortAnswers: ["불완전", "불완전성", "완전하게 표현할 수 없다", "유한한 인간의 언어", "언어의 불완전성"],
            displayAnswer: "인간 언어의 불완전성 (완전하게 표현 불가)",
            explanation: "해설: 무한대에 속하는 하나님의 위대한 사상은 유한한 인간의 사상 전달 수단인 언어로 완전하게 다 표현될 수 없다고 설명합니다."
          },
          {
            id: "ch1_5",
            q: "성경 전체를 인내와 기도로 탐구할 때 발견하게 되는 '영적 통일성'을 비유한 표현은 무엇입니까?",
            options: [
              "견고한 성벽",
              "하나의 굵은 황금실",
              "비밀스러운 열쇠",
              "빛나는 다이아몬드"
            ],
            answer: 1,
            shortAnswers: ["황금실", "굵은 황금실", "하나의 굵은 황금실", "황금 실"],
            displayAnswer: "하나의 굵은 황금실",
            explanation: "해설: 성경의 진리는 감추인 보석과 같아서, 인내와 기도로 탐구할 때 성경 전체를 관통하는 영적 통일성의 황금실을 발견하게 됩니다."
          },
          {
            id: "ch1_6",
            q: "화잇 여사가 계시에서 본 광경을 글로 기록할 때, 유일하게 따옴표(인용문) 표시를 한 언어의 출처는 누구입니까?",
            options: [
              "초기 교회의 개척자들",
              "천사 (천사가 직접 한 말)",
              "남편 제임스 화잇",
              "유명 신학 주석가"
            ],
            answer: 1,
            shortAnswers: ["천사", "천사의 말", "천사의말"],
            displayAnswer: "천사 (천사가 직접 한 말)",
            explanation: "해설: 계시에서 본 광경을 묘사할 때 사용하는 언어는 자신의 것이며, 천사가 직접 말한 것만 인용문(따옴표) 표시를 한다고 밝혔습니다."
          },
          {
            id: "ch1_7",
            q: "인간이 자기 판단으로 성경의 영감 여부를 가려내려는 비판적 태도는 궁극적으로 누구의 뜻을 따르는 것입니까?",
            options: [
              "성령의 뜻",
              "사단 (마귀)",
              "초대 교부들의 전통",
              "개혁자들의 뜻"
            ],
            answer: 1,
            shortAnswers: ["사단", "사탄", "마귀"],
            displayAnswer: "사단",
            explanation: "해설: 하나님께서는 어떤 인간에게도 영감된 부분과 그렇지 않은 부분을 가려낼 자격을 주지 않으셨으며, 성경을 비판하는 것은 사단이 바라는 일입니다."
          },
          {
            id: "ch1_8",
            q: "1844년 대실망 직후 첫 계시를 통해 '닫힌 문'의 기별은 빛을 보지 못한 자가 아니라 누구에게 닫힌 것이라 설명했습니까?",
            options: [
              "어린아이와 초신자",
              "기별과 성령의 호소를 의도적으로 거역하고 거절한 자들",
              "안식일을 아직 모르는 자들",
              "지상의 모든 인류"
            ],
            answer: 1,
            shortAnswers: ["거절한 자", "성령을 거스른 자", "거역한 자", "배도자"],
            displayAnswer: "기별을 거역하고 성령을 거스른 자들",
            explanation: "해설: 1844년에 닫힌 문은 하늘의 기별과 성령의 호소를 의도적으로 거절한 자들에게 해당하며, 빛을 보지 못한 자들을 위한 문은 열려 있습니다."
          },
          {

            shortAnswers: ["영적 준비 지연", "영적 준비", "준비 지연", "자극에 몰두"],
            displayAnswer: "시기에 관한 자극에 빠져 실질적인 영적 준비를 지연시킬 우려 때문",
            explanation: "해설: 때와 시기에 집착하는 감정적 자극에 빠져 영혼을 정결케 하는 참된 영적 준비를 게을리할 것을 막기 위함입니다."
          },
          {
            id: "ch3_9",
            q: "1904년 교회의 기초를 흔드는 범신론적 오류가 침투했을 때 화잇 여사가 들은 주님의 엄숙한 영문 명령은 무엇입니까?",
            options: [
              "Meet it! (대처하라!)",
              "Keep silent! (침묵하라!)",
              "Compromise! (타협하라!)",
              "Run away! (도피하라!)"
            ],
            answer: 0,
            shortAnswers: ["대처하라", "대처하라!", "Meet it", "Meet it!", "meet it"],
            displayAnswer: "대처하라! (Meet it!)",
            explanation: "해설: 켈록의 범신론 등 기반을 흔드는 거짓 교리가 침투할 때 주님께서는 '대처하라(Meet it!)'는 명령을 주셨습니다."
          },
          {
            id: "ch3_10",
            q: "사도 바울이 언급한, 죄를 깨닫게 하여 우리를 그리스도에게로 이끄는 몽학선생(초등교사) 역할을 하는 율법은 무엇입니까?",
            options: [
              "오직 성전의 제사 규례",
              "의문의 율법과 십계명(도덕법) 둘 다",
              "로마 제국의 시민법",
              "이스라엘의 토지 분배법"
            ],
            answer: 1,
            shortAnswers: ["도덕법과 의문의 율법", "십계명과 의문의 율법", "둘 다", "율법 둘 다"],
            displayAnswer: "의문의 율법(제사법)과 십계명(도덕법) 둘 다",
            explanation: "해설: 제사의 의미를 가르쳐 준 의문의 율법뿐 아니라 죄를 책망하여 그리스도를 찾게 하는 십계명 모두 몽학선생 역할을 합니다."
          }
        ]
      }
    };

    const STORAGE_KEY = "goldenbell_wrong_questions_v2";

    function getStoredWrongQuestions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveWrongQuestionToStorage(qObj) {
      const list = getStoredWrongQuestions();
      if (!list.some(item => item.id === qObj.id)) {
        list.push(qObj);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }
    }

    function removeCorrectQuestionFromStorage(qId) {
      let list = getStoredWrongQuestions();
      list = list.filter(item => item.id !== qId);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let currentChapterKey = null;
    let currentChapterTitle = "";
    let activeQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let roundWrongQuestions = [];
    let isWrongMode = false;
    let isStoredMode = false;
    let quizType = "multiple"; // 'multiple' 또는 'short'

    const QUESTION_TIME_LIMIT = 15;
    let timerInterval = null;
    let timeLeft = QUESTION_TIME_LIMIT;

    const chapterScreen = document.getElementById('chapter-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const timerToggle = document.getElementById('timer-toggle');
    const shortInput = document.getElementById('short-answer-input');

    // 주관식 엔터키 제출 이벤트
    shortInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitShortAnswer();
      }
    });

    function updateStoredWrongBtn() {
      const stored = getStoredWrongQuestions();
      const btn = document.getElementById('stored-wrong-btn');
      const countSpan = document.getElementById('stored-wrong-count');
      if (stored.length > 0) {
        btn.classList.remove('hidden');
        countSpan.innerText = stored.length;
      } else {
        btn.classList.add('hidden');
      }
    }

    function showChapterScreen() {
      clearInterval(timerInterval);
      chapterScreen.classList.remove('hidden');
      quizScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      document.getElementById('review-container').classList.add('hidden');
      
      updateStoredWrongBtn();

      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '';
      
      Object.keys(quizData).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = quizData[key].title + ` (${quizData[key].questions.length}문항)`;
        btn.onclick = () => startQuiz(key);
        listEl.appendChild(btn);
      });
    }

    function confirmExitToChapter() {
      if (confirm("문제를 푸는 도중입니다. 목차 화면으로 나가시겠습니까?")) {
        clearInterval(timerInterval);
        showChapterScreen();
      }
    }

    function getSelectedQuizType() {
      const selected = document.querySelector('input[name="quiz-type"]:checked');
      return selected ? selected.value : 'multiple';
    }

    function startQuiz(chapterKey) {
      currentChapterKey = chapterKey;
      currentChapterTitle = quizData[chapterKey].title;
      quizType = getSelectedQuizType();
      isWrongMode = false;
      isStoredMode = false;

      activeQuestions = shuffleArray(quizData[chapterKey].questions);
      resetAndLoadQuiz();
    }

    function retryCurrentQuiz() {
      if (isStoredMode) {
        startStoredWrongQuiz();
        return;
      }
      activeQuestions = shuffleArray(activeQuestions);
      resetAndLoadQuiz();
    }

    function startWrongOnlyQuiz() {
      if (roundWrongQuestions.length === 0) return;
      activeQuestions = shuffleArray(roundWrongQuestions);
      isWrongMode = true;
      resetAndLoadQuiz();
    }

    function startStoredWrongQuiz() {
      const stored = getStoredWrongQuestions();
      if (stored.length === 0) return;
      quizType = getSelectedQuizType();
      activeQuestions = shuffleArray(stored);
      currentChapterTitle = "📑 누적 오답 보관함";
      isWrongMode = false;
      isStoredMode = true;
      resetAndLoadQuiz();
    }

    function resetAndLoadQuiz() {
      clearInterval(timerInterval);
      currentQIndex = 0;
      score = 0;
      roundWrongQuestions = [];
      
      let modeText = quizType === 'short' ? "주관식 단답형" : "객관식 셔플";
      if (isWrongMode) modeText += " (오답 복습)";
      if (isStoredMode) modeText += " (누적 보관함)";
      
      document.getElementById('quiz-mode-badge').innerText = modeText;
      document.getElementById('review-container').classList.add('hidden');
      
      chapterScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      const rawQ = activeQuestions[currentQIndex];
      const totalQ = activeQuestions.length;
      
      document.getElementById('progress-fill').style.width = `${((currentQIndex) / totalQ) * 100}%`;
      document.getElementById('question-number').innerText = `${currentChapterTitle} — 문제 ${currentQIndex + 1} / ${totalQ}`;
      document.getElementById('question-text').innerText = rawQ.q;
      
      const optionsContainer = document.getElementById('options-container');
      const shortContainer = document.getElementById('short-answer-container');
      const expBox = document.getElementById('explanation-box');
      
      optionsContainer.innerHTML = '';
      expBox.style.display = 'none';
      expBox.innerText = '';
      document.getElementById('next-btn').classList.add('hidden');

      if (quizType === 'short') {
        optionsContainer.classList.add('hidden');
        shortContainer.classList.remove('hidden');
        shortInput.value = '';
        shortInput.disabled = false;
        document.getElementById('short-submit-btn').disabled = false;
        shortInput.focus();
      } else {
        shortContainer.classList.add('hidden');
        optionsContainer.classList.remove('hidden');

        const correctOptionText = rawQ.options[rawQ.answer];
        const shuffledOptions = shuffleArray(rawQ.options);
        const newCorrectIndex = shuffledOptions.indexOf(correctOptionText);

        shuffledOptions.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'btn option-btn';
          btn.innerText = `${idx + 1}. ${opt}`;
          btn.onclick = () => handleMultipleSelect(idx, newCorrectIndex, rawQ);
          optionsContainer.appendChild(btn);
        });
      }

      const timerUI = document.getElementById('timer-ui');
      if (timerToggle.checked) {
        timerUI.classList.remove('hidden');
        startTimer(rawQ);
      } else {
        timerUI.classList.add('hidden');
      }
    }

    function startTimer(rawQ) {
      timeLeft = QUESTION_TIME_LIMIT;
      const numSpan = document.getElementById('timer-num');
      const barFill = document.getElementById('timer-bar-fill');
      
      numSpan.innerText = timeLeft;
      barFill.style.width = "100%";

      timerInterval = setInterval(() => {
        timeLeft--;
        numSpan.innerText = timeLeft;
        barFill.style.width = `${(timeLeft / QUESTION_TIME_LIMIT) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut(rawQ);
        }
      }, 1000);
    }

    function handleTimeOut(rawQ) {
      if (quizType === 'short') {
        shortInput.disabled = true;
        document.getElementById('short-submit-btn').disabled = true;
      } else {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);
      }

      roundWrongQuestions.push(rawQ);
      saveWrongQuestionToStorage(rawQ);

      const expBox = document.getElementById('explanation-box');
      expBox.innerText = `⏱️ 시간 초과!\n정답: ${rawQ.displayAnswer || rawQ.options[rawQ.answer]}\n\n${rawQ.explanation}`;
      expBox.style.display = 'block';

      document.getElementById('next-btn').classList.remove('hidden');
    }

    function handleMultipleSelect(selectedIdx, correctIdx, rawQ) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);
      
      if (selectedIdx === correctIdx) {
        buttons[selectedIdx].classList.add('correct');
        score++;
        removeCorrectQuestionFromStorage(rawQ.id);
      } else {
        buttons[selectedIdx].classList.add('incorrect');
        buttons[correctIdx].classList.add('correct');
        roundWrongQuestions.push(rawQ);
        saveWrongQuestionToStorage(rawQ);
      }
      
      const expBox = document.getElementById('explanation-box');
      expBox.innerText = rawQ.explanation;
      expBox.style.display = 'block';
      
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function submitShortAnswer() {
      const userInput = shortInput.value.trim();
      if (!userInput) return;

      clearInterval(timerInterval);
      const rawQ = activeQuestions[currentQIndex];
      shortInput.disabled = true;
      document.getElementById('short-submit-btn').disabled = true;

      const cleanInput = userInput.replace(/\s+/g, '').toLowerCase();
      const isCorrect = rawQ.shortAnswers.some(ans => cleanInput === ans.replace(/\s+/g, '').toLowerCase());

      const expBox = document.getElementById('explanation-box');
      if (isCorrect) {
        score++;
        removeCorrectQuestionFromStorage(rawQ.id);
        expBox.innerText = `🎉 정답입니다! (입력: ${userInput})\n\n${rawQ.explanation}`;
      } else {
        roundWrongQuestions.push(rawQ);
        saveWrongQuestionToStorage(rawQ);
        expBox.innerText = `❌ 아쉽습니다! (입력: ${userInput})\n정답: ${rawQ.displayAnswer}\n\n${rawQ.explanation}`;
      }

      expBox.style.display = 'block';
      document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
      currentQIndex++;
      if (currentQIndex < activeQuestions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      clearInterval(timerInterval);
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      
      const total = activeQuestions.length;
      document.getElementById('score-text').innerText = `${score} / ${total}`;
      
      const pct = (score / total) * 100;
      let msg = "";
      if (pct === 100) msg = "🎉 완벽합니다! 만점을 획득하셨습니다!";
      else if (pct >= 70) msg = "👏 훌륭합니다! 틀린 문제를 다시 점검해 보세요.";
      else msg = "💪 반복이 승리입니다! 오답 노트를 복습해 보세요.";
      
      document.getElementById('result-msg').innerText = msg;

      const retryWrongBtn = document.getElementById('retry-wrong-btn');
      const toggleReviewBtn = document.getElementById('toggle-review-btn');
      
      if (roundWrongQuestions.length > 0) {
        retryWrongBtn.classList.remove('hidden');
        retryWrongBtn.innerText = `방금 틀린 문제 다시 풀기 (${roundWrongQuestions.length}문항)`;
        toggleReviewBtn.classList.remove('hidden');
        buildReviewList();
      } else {
        retryWrongBtn.classList.add('hidden');
        toggleReviewBtn.classList.add('hidden');
      }
      
      updateStoredWrongBtn();
    }

    function buildReviewList() {
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';
      
      roundWrongQuestions.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `
          <div class="review-q">${idx + 1}. ${item.q}</div>
          <div class="review-ans">정답: ${item.displayAnswer || item.options[item.answer]}</div>
          <div class="review-exp">${item.explanation}</div>
        `;
        reviewList.appendChild(div);
      });
    }

    function toggleWrongReview() {
      const container = document.getElementById('review-container');
      const btn = document.getElementById('toggle-review-btn');
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        btn.innerText = "오답 노트 닫기";
      } else {
        container.classList.add('hidden');
        btn.innerText = "오답 노트 확인하기";
      }
    }

    showChapterScreen();
  </script>
</body>
</html>
