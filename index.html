<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가려뽑은기별 1권 골든벨 퀴즈</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --primary-light: #2563eb;
      --primary-hover: #1d4ed8;
      --gold-accent: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --correct-color: #15803d;
      --correct-bg: #dcfce7;
      --incorrect-color: #b91c1c;
      --incorrect-bg: #fee2e2;
      --timer-color: #ea580c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      line-height: 1.5;
      padding: 6px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(30, 58, 138, 0.08);
      padding: 14px 12px;
      position: relative;
    }
    
    /* D-Day 카운트다운 배너 */
    .dday-banner {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .dday-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e0e7ff;
    }
    .dday-sub {
      font-size: 0.78rem;
      color: #bfdbfe;
      margin-top: 2px;
    }
    .dday-badge {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fef08a;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 8px;
      letter-spacing: -0.5px;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 12px;
    }
    h1 { 
      font-size: 1.35rem; 
      color: var(--primary-color); 
      word-break: keep-all; 
      font-weight: 800;
    }
    p.subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    
    /* 설정 박스 */
    .settings-panel {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.92rem;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .toggle-switch input {
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: var(--primary-light);
    }
    .mode-select-group {
      display: flex;
      gap: 12px;
    }
    .mode-radio-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .mode-radio-label input {
      accent-color: var(--primary-light);
    }

    /* 퀴즈 네비게이션 상단바 */
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .nav-btn {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: var(--primary-color);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: #ffffff;
    }
    .badge-mode {
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* 타이머 바 */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--timer-color);
      margin-bottom: 8px;
      background: #fff7ed;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .timer-bar-bg {
      flex: 1;
      height: 7px;
      background: #fed7aa;
      border-radius: 4px;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      background: var(--timer-color);
      width: 100%;
      transition: width 1s linear;
    }

    /* 버튼 스타일링 */
    .btn {
      display: block;
      width: 100%;
      padding: 14px 14px;
      margin: 8px 0;
      background: #ffffff;
      border: 1.5px solid #d8e2ec;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
    }
    .btn:hover {
      border-color: var(--primary-light);
      background-color: #f8fafc;
    }
    .btn-chapter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 14px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      margin-bottom: 8px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .btn-chapter .count-tag {
      font-size: 0.85rem;
      background: #eef2ff;
      color: var(--primary-light);
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .btn-primary {
      background: var(--primary-color);
      color: white;
      text-align: center;
      border: none;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: #f8fafc;
      color: #334155;
      text-align: center;
      border: 1.5px solid #cbd5e1;
      font-weight: 700;
      font-size: 1rem;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .btn-danger {
      background: #fef2f2;
      color: var(--incorrect-color);
      text-align: center;
      border: 1.5px solid #fecaca;
      font-weight: 700;
      font-size: 1rem;
    }
    
    .progress-bar {
      height: 7px;
      background: #edf2f7;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-light), var(--gold-accent));
      width: 0%;
      transition: width 0.3s ease;
    }
    
    /* 문제 지문 대형화 */
    .question-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 16px;
      word-break: keep-all;
      line-height: 1.45;
      color: var(--text-main);
    }

    /* 보기 선택지 대형화 및 배지 분리 */
    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 1.12rem;
      font-weight: 600;
      border: 1.8px solid #cbd5e1;
      line-height: 1.45;
      padding: 13px 14px;
      color: var(--text-main);
    }
    .opt-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 26px;
      height: 26px;
      background: #f1f5f9;
      border-radius: 50%;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-top: 1px;
      flex-shrink: 0;
    }
    .opt-text {
      flex: 1;
    }
    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-color) !important;
      color: var(--correct-color) !important;
      font-weight: 800;
    }
    .option-btn.correct .opt-badge {
      background-color: var(--correct-color);
      color: #ffffff;
    }
    .option-btn.incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-color) !important;
      color: var(--incorrect-color) !important;
    }
    .option-btn.incorrect .opt-badge {
      background-color: var(--incorrect-color);
      color: #ffffff;
    }

    /* 주관식 단답형 인풋 */
    .short-input-box {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    .short-input {
      flex: 1;
      padding: 13px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1.1rem;
      outline: none;
      font-weight: 600;
    }
    .short-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .short-submit-btn {
      width: 90px;
      margin: 0;
      padding: 13px;
      font-size: 1.05rem;
    }
    
    .explanation-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #f8fafc;
      border-left: 5px solid var(--primary-light);
      font-size: 1.02rem;
      font-weight: 500;
      display: none;
      word-break: keep-all;
      white-space: pre-line;
      line-height: 1.5;
    }
    
    .hidden { display: none !important; }
    
    .result-box {
      text-align: center;
      padding: 10px 0;
    }
    .score-num {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary-color);
      margin: 10px 0;
      letter-spacing: -1px;
    }
    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    .review-item {
      text-align: left;
      border-top: 1px solid #e2e8f0;
      padding: 14px 0;
      font-size: 1rem;
    }
    .review-q {
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.45;
    }
    .review-ans {
      color: var(--correct-color);
      margin-bottom: 4px;
      font-weight: 800;
    }
    .review-exp {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 배너 & 헤더 (퀴즈 풀이 시 자동으로 숨겨짐) -->
    <div id="top-banner-group">
      <div class="dday-banner">
        <div>
          <div class="dday-title">🏆 골든벨 대회 2026.11.21(토)</div>
          <div id="dday-time-detail" class="dday-sub">계산 중...</div>
        </div>
        <div id="dday-badge" class="dday-badge">D-Day</div>
      </div>

      <header>
        <h1>가려뽑은기별 1권 골든벨 퀴즈</h1>
        <p class="subtitle">목차별 정밀 학습 · 객관식/단답형 실전 훈련</p>
      </header>
    </div>

    <!-- 1. 목차 선택 화면 -->
    <div id="chapter-screen">
      <div class="settings-panel">
        <div class="setting-row">
          <span>🎯 <strong>문제 유형</strong></span>
          <div class="mode-select-group">
            <label class="mode-radio-label">
              <input type="radio" name="quiz-type" value="multiple" checked onchange="renderChapterList()"> 객관식
            </label>
            <label class="mode-radio-label">
              <input type="radio" name="quiz-type" value="short" onchange="renderChapterList()"> 단답형
            </label>
          </div>
        </div>
        <div class="setting-row">
          <span>⚡ <strong>초읽기 타이머 (15초)</strong></span>
          <label class="toggle-switch">
            <input type="checkbox" id="timer-toggle">
            <span>사용</span>
          </label>
        </div>
      </div>

      <div style="margin-bottom: 14px;">
        <button id="stored-wrong-btn" onclick="startStoredWrongQuiz()" class="btn btn-danger hidden" style="text-align: center;">
          📑 누적 오답 보관함 풀기 (<span id="stored-wrong-count">0</span>문항)
        </button>
      </div>

      <h2 style="font-size: 1.05rem; margin-bottom: 10px; color: var(--text-main); font-weight: 800;">풀고 싶은 단원을 선택하세요:</h2>
      <div id="chapter-list"></div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-nav">
        <button class="nav-btn" onclick="confirmExitToChapter()">
          ← 목차로 나가기
        </button>
        <span id="quiz-mode-badge" class="badge-mode">일반 풀이</span>
      </div>

      <div id="timer-ui" class="timer-container hidden">
        <span>⏳ 남은 시간: <span id="timer-num">15</span>초</span>
        <div class="timer-bar-bg">
          <div id="timer-bar-fill" class="timer-bar-fill"></div>
        </div>
      </div>

      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="question-number" style="font-size: 0.92rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700;"></div>
      <div id="question-text" class="question-title"></div>
      
      <!-- 객관식 보기 영역 -->
      <div id="options-container"></div>
      
      <!-- 주관식 입력 영역 -->
      <div id="short-answer-container" class="hidden">
        <div class="short-input-box">
          <input type="text" id="short-answer-input" class="short-input" placeholder="정답 키워드를 입력하세요" autocomplete="off">
          <button id="short-submit-btn" class="btn btn-primary short-submit-btn" onclick="submitShortAnswer()">제출</button>
        </div>
      </div>

      <div id="explanation-box" class="explanation-box"></div>
      <button id="next-btn" class="btn btn-primary hidden" style="margin-top: 14px;">다음 문제</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="result-box">
        <h2>퀴즈 완료!</h2>
        <div id="score-text" class="score-num">0 / 0</div>
        <p id="result-msg" style="margin-bottom: 16px; color: var(--text-muted); font-size: 1.05rem; font-weight: 600;"></p>
        
        <div class="result-actions">
          <button id="retry-wrong-btn" onclick="startWrongOnlyQuiz()" class="btn btn-danger hidden">방금 틀린 문제 다시 풀기</button>
          <button onclick="retryCurrentQuiz()" class="btn btn-secondary">현재 모드로 다시 풀기 (셔플)</button>
          <button id="toggle-review-btn" onclick="toggleWrongReview()" class="btn btn-secondary hidden">오답 노트 확인하기</button>
          <button onclick="showChapterScreen()" class="btn btn-primary">목차 화면으로 이동</button>
        </div>

        <div id="review-container" class="hidden" style="margin-top: 22px; text-align: left;">
          <h3 style="font-size: 1.05rem; margin-bottom: 10px; color: var(--incorrect-color); font-weight: 800;">틀린 문제 해설 목록</h3>
          <div id="review-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // D-Day 실시간 계산 (시험일: 2026-11-21)
    const TARGET_DATE = new Date(2026, 10, 21, 0, 0, 0);

    function updateDDay() {
      const now = new Date();
      const diff = TARGET_DATE - now;

      const badgeEl = document.getElementById('dday-badge');
      const detailEl = document.getElementById('dday-time-detail');

      if (diff <= 0) {
        badgeEl.innerText = "D-DAY";
        detailEl.innerText = "오늘이 결전의 날입니다! 승리하세요!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      badgeEl.innerText = `D-${days}`;
      detailEl.innerText = `남은 시간: ${days}일 ${hours}시간 ${minutes}분 ${seconds}초`;
    }
    setInterval(updateDDay, 1000);
    updateDDay();

    const quizData = {
      "ch1_part1": {
        title: "제1장 Part 1: 영감과 성경의 권위 (pp. 15~39)",
        questions: [
          {
            id: "ch1_p1_1",
            q: "가려뽑은기별 1권 제1장 서두(15p)에서 화잇 여사는 성경을 해석함에 있어서 회의주의와 불신 사상이 나타나는 시대를 경고하며 예수님의 어떤 말씀(눅 18:8)을 인용합니까?",
            options: [
              "인자가 올 때에 세상에서 믿음을 보겠느냐",
              "너희는 세상의 소금이니 소금이 만일 그 맛을 잃으면 무엇으로 짜게 하리요",
              "구하라 그리하면 너희에게 주실 것이요",
              "수고하고 무거운 짐진 자들아 다 내게로 오라"
            ],
            answer: 0,
            shortAnswers: ["믿음을 보겠느냐", "세상에서 믿음을 보겠느냐", "인자가 올 때에 세상에서 믿음을 보겠느냐"],
            displayAnswer: "인자가 올 때에 세상에서 믿음을 보겠느냐",
            explanation: "해설 [15p]: 15페이지 첫 문장에서 '지금 이 때야말로 \"인자가 올 때에 세상에서 믿음을 보겠느냐\"(눅 18:8)고 물어보아야 할 가장 적절한 때이다'라고 시작합니다."
          },
          {
            id: "ch1_p1_2",
            q: "주님께서 기적적인 능력으로 거룩한 책(성경)을 오늘날의 형태로 보존하시어 타락한 인간 가족에게 주신 목적은 무엇입니까?",
            options: [
              "세상적인 학문과 과학의 우수성을 증명하기 위하여",
              "천국으로 인도하는 길을 보여 주기 위하여 주신 하나의 도표이며 안내서로 사용하도록",
              "교회의 세속적 권력을 강화하기 위하여",
              "인간의 문학적 재능을 겨루는 기준이 되도록"
            ],
            answer: 1,
            explanation: "해설 [15p]: '이 책은 인간 가족들에게 천국으로 인도하는 길을 보여 주기 위하여 주신 하나의 도표이며 안내서이다'라고 밝힙니다."
          },
          {
            id: "ch1_p1_3",
            q: "성경에 기록된 말씀보다 더 지혜로운 척하며 성경의 모순을 스스로 시정하려고 마음먹은 사람들의 그릇된 제의 표현은 무엇입니까?",
            options: [
              "\"오직 성경으로만 돌아가자\"",
              "\"주님께서 이런 뜻으로 말씀하셨을 것이다\" 혹은 \"주님께서 이렇게 말씀했으면 더욱 좋았을 것이다\"",
              "\"성경 원본의 언어를 고어체로 바꾸어야 한다\"",
              "\"선지자들의 환상을 현대 의학으로 분석해야 한다\""
            ],
            answer: 1,
            explanation: "해설 [16p]: '\"주님께서 이런 뜻으로 말씀하셨을 것이다\" 혹은 \"주님께서 이렇게 말씀하셨으면 더욱 좋았을 것이다\"는 등의 제의로써 성경을 개선할 수 있는 사람은 아무도 없다'고 경고합니다."
          },

      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let currentChapterKey = null;
    let currentChapterTitle = "";
    let activeQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let roundWrongQuestions = [];
    let isWrongMode = false;
    let isStoredMode = false;
    let quizType = "multiple";

    const QUESTION_TIME_LIMIT = 15;
    let timerInterval = null;
    let timeLeft = QUESTION_TIME_LIMIT;

    const topBannerGroup = document.getElementById('top-banner-group');
    const chapterScreen = document.getElementById('chapter-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const timerToggle = document.getElementById('timer-toggle');
    const shortInput = document.getElementById('short-answer-input');

    shortInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitShortAnswer();
      }
    });

    function updateStoredWrongBtn() {
      const stored = getStoredWrongQuestions();
      const btn = document.getElementById('stored-wrong-btn');
      const countSpan = document.getElementById('stored-wrong-count');
      if (stored.length > 0) {
        btn.classList.remove('hidden');
        countSpan.innerText = stored.length;
      } else {
        btn.classList.add('hidden');
      }
    }

    function getSelectedQuizType() {
      const selected = document.querySelector('input[name="quiz-type"]:checked');
      return selected ? selected.value : 'multiple';
    }

    function renderChapterList() {
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '';
      const currentType = getSelectedQuizType();
      
      Object.keys(quizData).forEach(key => {
        const chapter = quizData[key];
        let count = 0;
        let countLabel = "";

        if (currentType === 'short') {
          // 단답 키워드가 정의된 문제만 카운트
          count = chapter.questions.filter(q => Array.isArray(q.shortAnswers) && q.shortAnswers.length > 0).length;
          countLabel = `단답 가능 ${count}문항`;
        } else {
          count = chapter.questions.length;
          countLabel = `총 ${count}문항`;
        }

        const btn = document.createElement('button');
        btn.className = 'btn btn-chapter';
        btn.innerHTML = `
          <span>${chapter.title}</span>
          <span class="count-tag">${countLabel}</span>
        `;

        if (count === 0 && currentType === 'short') {
          btn.style.opacity = '0.5';
          btn.onclick = () => alert("이 단원에는 단답형으로 지정된 문제가 없습니다. 객관식 모드를 이용해 주세요.");
        } else {
          btn.onclick = () => startQuiz(key);
        }

        listEl.appendChild(btn);
      });
    }

    function showChapterScreen() {
      clearInterval(timerInterval);
      topBannerGroup.classList.remove('hidden');
      chapterScreen.classList.remove('hidden');
      quizScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      document.getElementById('review-container').classList.add('hidden');
      
      updateStoredWrongBtn();
      renderChapterList();
    }

    function confirmExitToChapter() {
      if (confirm("문제를 푸는 도중입니다. 목차 화면으로 나가시겠습니까?")) {
        clearInterval(timerInterval);
        showChapterScreen();
      }
    }

    function startQuiz(chapterKey) {
      currentChapterKey = chapterKey;
      currentChapterTitle = quizData[chapterKey].title;
      quizType = getSelectedQuizType();
      isWrongMode = false;
      isStoredMode = false;

      let qList = quizData[chapterKey].questions;
      // 단답형 모드일 때는 shortAnswers가 있는 문제만 필터링
      if (quizType === 'short') {
        qList = qList.filter(q => Array.isArray(q.shortAnswers) && q.shortAnswers.length > 0);
      }

      activeQuestions = shuffleArray(qList);
      resetAndLoadQuiz();
    }

    function retryCurrentQuiz() {
      if (isStoredMode) {
        startStoredWrongQuiz();
        return;
      }
      activeQuestions = shuffleArray(activeQuestions);
      resetAndLoadQuiz();
    }

    function startWrongOnlyQuiz() {
      if (roundWrongQuestions.length === 0) return;
      activeQuestions = shuffleArray(roundWrongQuestions);
      isWrongMode = true;
      resetAndLoadQuiz();
    }

    function startStoredWrongQuiz() {
      const stored = getStoredWrongQuestions();
      if (stored.length === 0) return;
      quizType = getSelectedQuizType();

      let qList = stored;
      if (quizType === 'short') {
        qList = qList.filter(q => Array.isArray(q.shortAnswers) && q.shortAnswers.length > 0);
        if (qList.length === 0) {
          alert("누적 오답 보관함에 단답형으로 풀 수 있는 문제가 없습니다.");
          return;
        }
      }

      activeQuestions = shuffleArray(qList);
      currentChapterTitle = "📑 누적 오답 보관함";
      isWrongMode = false;
      isStoredMode = true;
      resetAndLoadQuiz();
    }

    function resetAndLoadQuiz() {
      clearInterval(timerInterval);
      currentQIndex = 0;
      score = 0;
      roundWrongQuestions = [];
      
      let modeText = quizType === 'short' ? "단답형" : "객관식 셔플";
      if (isWrongMode) modeText += " · 오답";
      if (isStoredMode) modeText += " · 누적 오답";
      
      document.getElementById('quiz-mode-badge').innerText = modeText;
      document.getElementById('review-container').classList.add('hidden');
      
      topBannerGroup.classList.add('hidden');
      chapterScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      const rawQ = activeQuestions[currentQIndex];
      const totalQ = activeQuestions.length;
      
      document.getElementById('progress-fill').style.width = `${((currentQIndex) / totalQ) * 100}%`;
      document.getElementById('question-number').innerText = `${currentChapterTitle} — 문제 ${currentQIndex + 1} / ${totalQ}`;
      document.getElementById('question-text').innerText = rawQ.q;
      
      const optionsContainer = document.getElementById('options-container');
      const shortContainer = document.getElementById('short-answer-container');
      const expBox = document.getElementById('explanation-box');
      
      optionsContainer.innerHTML = '';
      expBox.style.display = 'none';
      expBox.innerText = '';
      document.getElementById('next-btn').classList.add('hidden');

      if (quizType === 'short') {
        optionsContainer.classList.add('hidden');
        shortContainer.classList.remove('hidden');
        shortInput.value = '';
        shortInput.disabled = false;
        document.getElementById('short-submit-btn').disabled = false;
        shortInput.focus();
      } else {
        shortContainer.classList.add('hidden');
        optionsContainer.classList.remove('hidden');

        const correctOptionText = rawQ.options[rawQ.answer];
        const shuffledOptions = shuffleArray(rawQ.options);
        const newCorrectIndex = shuffledOptions.indexOf(correctOptionText);

        shuffledOptions.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'btn option-btn';
          btn.innerHTML = `
            <span class="opt-badge">${idx + 1}</span>
            <span class="opt-text">${opt}</span>
          `;
          btn.onclick = () => handleMultipleSelect(idx, newCorrectIndex, rawQ);
          optionsContainer.appendChild(btn);
        });
      }

      const timerUI = document.getElementById('timer-ui');
      if (timerToggle.checked) {
        timerUI.classList.remove('hidden');
        startTimer(rawQ);
      } else {
        timerUI.classList.add('hidden');
      }
    }

    function startTimer(rawQ) {
      timeLeft = QUESTION_TIME_LIMIT;
      const numSpan = document.getElementById('timer-num');
      const barFill = document.getElementById('timer-bar-fill');
      
      numSpan.innerText = timeLeft;
      barFill.style.width = "100%";

      timerInterval = setInterval(() => {
        timeLeft--;
        numSpan.innerText = timeLeft;
        barFill.style.width = `${(timeLeft / QUESTION_TIME_LIMIT) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut(rawQ);
        }
      }, 1000);
    }

    function handleTimeOut(rawQ) {
      if (quizType === 'short') {
        shortInput.disabled = true;
        document.getElementById('short-submit-btn').disabled = true;
      } else {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);
      }

      roundWrongQuestions.push(rawQ);
      saveWrongQuestionToStorage(rawQ);

      const expBox = document.getElementById('explanation-box');
      expBox.innerText = `⏱️ 시간 초과!\n정답: ${rawQ.displayAnswer || rawQ.options[rawQ.answer]}\n\n${rawQ.explanation}`;
      expBox.style.display = 'block';

      document.getElementById('next-btn').classList.remove('hidden');
    }

    function handleMultipleSelect(selectedIdx, correctIdx, rawQ) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);
      
      if (selectedIdx === correctIdx) {
        buttons[selectedIdx].classList.add('correct');
        score++;
        if (rawQ.id) removeCorrectQuestionFromStorage(rawQ.id);
      } else {
        buttons[selectedIdx].classList.add('incorrect');
        buttons[correctIdx].classList.add('correct');
        roundWrongQuestions.push(rawQ);
        saveWrongQuestionToStorage(rawQ);
      }
      
      const expBox = document.getElementById('explanation-box');
      expBox.innerText = rawQ.explanation;
      expBox.style.display = 'block';
      
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function submitShortAnswer() {
      const userInput = shortInput.value.trim();
      if (!userInput) return;

      clearInterval(timerInterval);
      const rawQ = activeQuestions[currentQIndex];
      shortInput.disabled = true;
      document.getElementById('short-submit-btn').disabled = true;

      const cleanInput = userInput.replace(/\s+/g, '').toLowerCase();

      // 단답형 키워드 배열 또는 기본 정답 참조
      const defaultAnswerText = (rawQ.options && rawQ.options[rawQ.answer]) ? rawQ.options[rawQ.answer] : "";
      const validAnswers = (Array.isArray(rawQ.shortAnswers) && rawQ.shortAnswers.length > 0)
        ? rawQ.shortAnswers
        : [defaultAnswerText];

      const isCorrect = validAnswers.some(ans => cleanInput === String(ans).replace(/\s+/g, '').toLowerCase());
      const correctAnswerDisplay = rawQ.displayAnswer || defaultAnswerText;

      const expBox = document.getElementById('explanation-box');
      if (isCorrect) {
        score++;
        if (rawQ.id) removeCorrectQuestionFromStorage(rawQ.id);
        expBox.innerText = `🎉 정답입니다! (입력: ${userInput})\n\n${rawQ.explanation || ''}`;
      } else {
        roundWrongQuestions.push(rawQ);
        saveWrongQuestionToStorage(rawQ);
        expBox.innerText = `❌ 오답입니다! (입력: ${userInput})\n정답: ${correctAnswerDisplay}\n\n${rawQ.explanation || ''}`;
      }

      expBox.style.display = 'block';
      document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
      currentQIndex++;
      if (currentQIndex < activeQuestions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      clearInterval(timerInterval);
      topBannerGroup.classList.remove('hidden');
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      
      const total = activeQuestions.length;
      document.getElementById('score-text').innerText = `${score} / ${total}`;
      
      const pct = (score / total) * 100;
      let msg = "";
      if (pct === 100) msg = "🎉 완벽합니다! 만점을 획득하셨습니다!";
      else if (pct >= 70) msg = "👏 훌륭합니다! 틀린 문제를 다시 점검해 보세요.";
      else msg = "💪 반복이 승리입니다! 오답 노트를 복습해 보세요.";
      
      document.getElementById('result-msg').innerText = msg;

      const retryWrongBtn = document.getElementById('retry-wrong-btn');
      const toggleReviewBtn = document.getElementById('toggle-review-btn');
      
      if (roundWrongQuestions.length > 0) {
        retryWrongBtn.classList.remove('hidden');
        retryWrongBtn.innerText = `방금 틀린 문제 다시 풀기 (${roundWrongQuestions.length}문항)`;
        toggleReviewBtn.classList.remove('hidden');
        buildReviewList();
      } else {
        retryWrongBtn.classList.add('hidden');
        toggleReviewBtn.classList.add('hidden');
      }
      
      updateStoredWrongBtn();
    }

    function buildReviewList() {
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';
      
      roundWrongQuestions.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `
          <div class="review-q">${idx + 1}. ${item.q}</div>
          <div class="review-ans">정답: ${item.displayAnswer || item.options[item.answer]}</div>
          <div class="review-exp">${item.explanation}</div>
        `;
        reviewList.appendChild(div);
      });
    }

    function toggleWrongReview() {
      const container = document.getElementById('review-container');
      const btn = document.getElementById('toggle-review-btn');
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        btn.innerText = "오답 노트 닫기";
      } else {
        container.classList.add('hidden');
        btn.innerText = "오답 노트 확인하기";
      }
    }

    showChapterScreen();
  </script>
</body>
</html>
