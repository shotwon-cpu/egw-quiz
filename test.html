<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원룸 매니저 Pro</title>
  <!-- Tailwind CSS & Lucide Icons & React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 부동산 연락처 미리 지정
    const AGENCY_PHONE = '010-1234-5678';

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');

      // 1. 호실 데이터 (로컬 샘플 데이터)
      const [rooms, setRooms] = useState([
        { id: 101, status: 'vacant', deposit: 500, rent: 45, maintenance: 5, note: '풀옵션, 남향, 도배 완료' },
        { id: 102, status: 'occupied', deposit: 500, rent: 40, maintenance: 5, note: '장기 계약' },
        { id: 201, status: 'vacant', deposit: 1000, rent: 50, maintenance: 5, note: '분리형 원룸, 엘리베이터 앞' },
        { id: 202, status: 'repairing', deposit: 500, rent: 45, maintenance: 5, note: '도어락 수리 중' },
        { id: 301, status: 'occupied', deposit: 500, rent: 42, maintenance: 5, note: '월세 완납' },
      ]);

      // 2. 세입자 데이터
      const [tenants] = useState([
        { id: 1, roomId: 102, name: '김철수', phone: '010-2222-3333', startDate: '2025-03-01', endDate: '2027-02-28', paidStatus: 'paid' },
        { id: 2, roomId: 301, name: '이영희', phone: '010-8888-9999', startDate: '2024-11-15', endDate: '2026-11-14', paidStatus: 'unpaid' },
      ]);

      // 3. 수리 내역 데이터
      const [repairs] = useState([
        { id: 1, roomId: 202, title: '전자키 도어락 교체', cost: 15, status: 'processing', date: '2026-09-20' },
        { id: 2, roomId: 101, title: '에어컨 냉매 충전 및 청소', cost: 8, status: 'completed', date: '2026-08-10' },
      ]);

      // 아이콘 리프레시
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, rooms]);

      // 지표 자동 계산
      const totalRooms = rooms.length;
      const vacantCount = rooms.filter(r => r.status === 'vacant').length;
      const occupiedCount = rooms.filter(r => r.status === 'occupied').length;
      const occupancyRate = ((occupiedCount / totalRooms) * 100).toFixed(0);
      
      const totalIncome = rooms
        .filter(r => r.status === 'occupied')
        .reduce((acc, cur) => acc + cur.rent + cur.maintenance, 0);

      const vacantLoss = rooms
        .filter(r => r.status === 'vacant')
        .reduce((acc, cur) => acc + cur.rent + cur.maintenance, 0);

      const unpaidCount = tenants.filter(t => t.paidStatus === 'unpaid').length;

      // 부동산 SMS 문장 생성 및 문자 앱 연동
      function sendSmsToAgency(room) {
        const message = `[공실 정보 안내]\n- 호실: ${room.id}호\n- 금액: 보증금 ${room.deposit}만 / 월세 ${room.rent}만 (관리비 ${room.maintenance}만)\n- 특징: ${room.note}\n- 입주: 즉시 입주 가능\n연락 부탁드립니다.`;
        const smsUrl = `sms:${AGENCY_PHONE}?body=${encodeURIComponent(message)}`;
        window.location.href = smsUrl;
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* 사이드바 메뉴 */}
          <aside className="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between shrink-0 shadow-xl">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="p-2 bg-indigo-600 rounded-xl">
                  <i data-lucide="building-2" className="w-6 h-6 text-white"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">원룸 매니저</h1>
                  <span className="text-xs text-indigo-400 font-medium">건물 자산관리 Pro</span>
                </div>
              </div>

              <nav className="space-y-1.5">
                {[
                  { id: 'dashboard', label: '대시보드 요약', icon: 'layout-dashboard' },
                  { id: 'rooms', label: '호실/공실 관리', icon: 'home' },
                  { id: 'tenants', label: '계약자/월세 관리', icon: 'users' },
                  { id: 'repairs', label: '수리/유지보수', icon: 'wrench' },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${
                      activeTab === tab.id 
                        ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <i data-lucide={tab.icon} className="w-4 h-4"></i>
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="mt-8 pt-4 border-t border-slate-800 text-xs text-slate-500">
              <p>부동산 연락처: <span className="text-slate-300 font-mono">{AGENCY_PHONE}</span></p>
            </div>
          </aside>

          {/* 메인 콘텐츠 영역 */}
          <main className="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full">
            
            {/* 1. 대시보드 탭 */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">건물 운영 대시보드</h2>
                  <p className="text-sm text-slate-500 mt-1">현재 임대 상태 및 수익 현황을 확인하세요.</p>
                </div>

                {/* 지표 카드 4개 */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">가동률</span>
                      <span className="p-2 bg-indigo-50 text-indigo-600 rounded-lg"><i data-lucide="pie-chart" className="w-4 h-4"></i></span>
                    </div>
                    <div className="flex items-baseline justify-between">
                      <span className="text-3xl font-extrabold text-slate-900">{occupancyRate}%</span>
                      <span className="text-xs font-semibold px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full">
                        {occupiedCount}/{totalRooms} 세대 입주
                      </span>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">이번 달 예상 수입</span>
                      <span className="p-2 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="wallet" className="w-4 h-4"></i></span>
                    </div>
                    <span className="text-3xl font-extrabold text-indigo-600">{totalIncome}만원</span>
                    <p className="text-xs text-slate-400 mt-1">월세 + 관리비 포함</p>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">월세 미납</span>
                      <span className="p-2 bg-rose-50 text-rose-600 rounded-lg"><i data-lucide="alert-circle" className="w-4 h-4"></i></span>
                    </div>
                    <div className="flex items-baseline justify-between">
                      <span className="text-3xl font-extrabold text-rose-600">{unpaidCount}건</span>
                      {unpaidCount > 0 && <span className="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded">즉시 독촉 필요</span>}
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">공실 손실(월)</span>
                      <span className="p-2 bg-amber-50 text-amber-600 rounded-lg"><i data-lucide="trending-down" className="w-4 h-4"></i></span>
                    </div>
                    <span className="text-3xl font-extrabold text-amber-600">-{vacantLoss}만원</span>
                    <p className="text-xs text-slate-400 mt-1">공실 {vacantCount}개 가구 손실</p>
                  </div>
                </div>

                {/* 미납 및 공실 빠른 조치 세션 */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                    <h3 className="font-bold text-base mb-4 flex items-center gap-2 text-rose-600">
                      <i data-lucide="alert-triangle" className="w-5 h-5"></i> 미납 세입자 목록
                    </h3>
                    {tenants.filter(t => t.paidStatus === 'unpaid').map(t => (
                      <div key={t.id} className="p-4 bg-rose-50/60 border border-rose-100 rounded-xl flex justify-between items-center">
                        <div>
                          <p className="font-bold text-rose-950">{t.roomId}호 ({t.name})</p>
                          <p className="text-xs text-rose-700 mt-0.5">연락처: {t.phone}</p>
                        </div>
                        <a href={`tel:${t.phone}`} className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl flex items-center gap-1.5 transition">
                          <i data-lucide="phone" className="w-3.5 h-3.5"></i> 전화 걸기
                        </a>
                      </div>
                    ))}
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                    <h3 className="font-bold text-base mb-4 flex items-center gap-2 text-amber-600">
                      <i data-lucide="building" className="w-5 h-5"></i> 공실 즉시 중개 요청
                    </h3>
                    <div className="space-y-2">
                      {rooms.filter(r => r.status === 'vacant').map(r => (
                        <div key={r.id} className="p-3.5 bg-amber-50/60 border border-amber-100 rounded-xl flex justify-between items-center">
                          <div>
                            <span className="font-bold text-amber-950">{r.id}호</span>
                            <span className="text-xs text-amber-800 ml-2">{r.deposit}/{r.rent}만 ({r.note})</span>
                          </div>
                          <button onClick={() => sendSmsToAgency(r)} className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-lg flex items-center gap-1 transition">
                            <i data-lucide="send" className="w-3 h-3"></i> 문자 발송
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. 호실/공실 관리 탭 */}
            {activeTab === 'rooms' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900">호실 상태 및 공실 관리</h2>
                    <p className="text-sm text-slate-500 mt-1">공실 카드 하단의 [부동산 문자]를 누르면 문자가 자동 작성됩니다.</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {rooms.map(room => (
                    <div key={room.id} className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start mb-3">
                          <div className="flex items-center gap-2">
                            <span className="text-2xl font-black text-slate-900">{room.id}호</span>
                          </div>
                          <span className={`px-3 py-1 rounded-full text-xs font-extrabold ${
                            room.status === 'vacant' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                            room.status === 'occupied' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 
                            'bg-rose-100 text-rose-800 border border-rose-200'
                          }`}>
                            {room.status === 'vacant' ? '● 공실' : room.status === 'occupied' ? '● 입주 중' : '● 수리 중'}
                          </span>
                        </div>

                        <div className="space-y-1.5 text-sm text-slate-600 bg-slate-50 p-3.5 rounded-xl border border-slate-100 mb-4">
                          <p className="flex justify-between"><span>보증금</span> <span className="font-bold text-slate-900">{room.deposit}만원</span></p>
                          <p className="flex justify-between"><span>월세 / 관리비</span> <span className="font-bold text-indigo-600">{room.rent}만 / {room.maintenance}만원</span></p>
                          <p className="text-xs text-slate-400 pt-1 border-t border-slate-200/60 mt-1">특징: {room.note}</p>
                        </div>
                      </div>

                      {room.status === 'vacant' ? (
                        <button 
                          onClick={() => sendSmsToAgency(room)}
                          className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-md shadow-indigo-600/20"
                        >
                          <i data-lucide="send" className="w-3.5 h-3.5"></i> 부동산에 공실 내놓기 (문자)
                        </button>
                      ) : (
                        <button disabled className="w-full py-2.5 bg-slate-100 text-slate-400 font-medium rounded-xl text-xs cursor-not-allowed">
                          임대 중인 호실
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. 계약자 관리 탭 */}
            {activeTab === 'tenants' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">계약자 및 세입자 관리</h2>
                  <p className="text-sm text-slate-500 mt-1">입주자 정보와 월세 완납 여부를 확인하세요.</p>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead className="bg-slate-50 text-slate-500 text-xs font-semibold uppercase border-b border-slate-100">
                        <tr>
                          <th className="p-4">호실</th>
                          <th className="p-4">이름</th>
                          <th className="p-4">연락처</th>
                          <th className="p-4">계약 기간</th>
                          <th className="p-4">월세 상태</th>
                          <th className="p-4 text-center">조치</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-sm">
                        {tenants.map(t => (
                          <tr key={t.id} className="hover:bg-slate-50/80 transition">
                            <td className="p-4 font-extrabold text-slate-900">{t.roomId}호</td>
                            <td className="p-4 font-semibold">{t.name}</td>
                            <td className="p-4 text-slate-500 font-mono">{t.phone}</td>
                            <td className="p-4 text-xs text-slate-500">{t.startDate} ~ {t.endDate}</td>
                            <td className="p-4">
                              <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${
                                t.paidStatus === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                              }`}>
                                {t.paidStatus === 'paid' ? '완납' : '미납'}
                              </span>
                            </td>
                            <td className="p-4 text-center">
                              <a href={`tel:${t.phone}`} className="inline-flex items-center gap-1 text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg">
                                <i data-lucide="phone" className="w-3 h-3"></i> 전화
                              </a>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 4. 수리 내역 탭 */}
            {activeTab === 'repairs' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">수리 및 유지보수 내역</h2>
                  <p className="text-sm text-slate-500 mt-1">건물 수리 접수 건과 지출 비용을 기록합니다.</p>
                </div>

                <div className="space-y-3">
                  {repairs.map(r => (
                    <div key={r.id} className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
                      <div className="flex items-start gap-4">
                        <div className="p-3 bg-slate-100 rounded-xl text-slate-700">
                          <i data-lucide="wrench" className="w-5 h-5"></i>
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-extrabold text-lg text-slate-900">{r.roomId}호</span>
                            <span className="font-bold text-slate-800">{r.title}</span>
                          </div>
                          <p className="text-xs text-slate-400 mt-1">접수일: {r.date} | 수리 비용: <span className="font-bold text-slate-700">{r.cost}만원</span></p>
                        </div>
                      </div>
                      <span className={`px-3 py-1.5 rounded-full text-xs font-bold ${
                        r.status === 'completed' ? 'bg-slate-100 text-slate-600' : 'bg-indigo-100 text-indigo-700'
                      }`}>
                        {r.status === 'completed' ? '수리 완료' : '진행 중'}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
