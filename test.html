<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원룸 매니저 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 🔴 1. 본인의 Supabase 프로젝트 정보로 교체하세요!
    const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
    const SUPABASE_KEY = 'your-anon-key';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 🔴 2. 자주 거래하는 부동산 연락처 미리 등록
    const AGENCY_PHONE = '010-1234-5678'; 

    function App() {
      const [activeTab, setActiveTab] = useState('rooms');
      const [rooms, setRooms] = useState([]);
      const [loading, setLoading] = useState(true);

      // DB에서 호실 데이터 가져오기
      useEffect(() => {
        fetchRooms();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [rooms, activeTab]);

      async function fetchRooms() {
        setLoading(true);
        const { data, error } = await supabase.from('rooms').select('*').order('room_number');
        if (!error && data) setRooms(data);
        setLoading(false);
      }

      // 부동산으로 공실 정보 문자 보내기 기능
      function sendSmsToAgency(room) {
        const message = `[공실 정보 안내]\n- 건물명: 원룸건물\n- 호실: ${room.room_number}호\n- 금액: 보증금 ${room.deposit}만 / 월세 ${room.rent}만 (관리비 ${room.maintenance}만)\n- 입주가능일: 즉시입주\n- 특징: 풀옵션, 수리완료\n연락주세요.`;
        
        // SMS 프로토콜 호출 (모바일 메시지 앱 자동 연결)
        const smsUrl = `sms:${AGENCY_PHONE}?body=${encodeURIComponent(message)}`;
        window.location.href = smsUrl;
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* 사이드바 */}
          <aside className="w-full md:w-64 bg-slate-900 text-white p-5">
            <h1 className="font-bold text-xl mb-6 flex items-center gap-2">
              <i data-lucide="building-2" className="text-indigo-400"></i> 원룸 매니저
            </h1>
            <nav className="flex md:flex-col gap-2">
              <button onClick={() => setActiveTab('rooms')} className={`px-4 py-2.5 rounded-xl font-medium text-left transition ${activeTab === 'rooms' ? 'bg-indigo-600' : 'text-slate-400'}`}>
                호실/공실 관리
              </button>
            </nav>
          </aside>

          {/* 메인 콘텐츠 */}
          <main className="flex-1 p-6">
            <h2 className="text-2xl font-bold mb-6">호실 및 공실 상태</h2>

            {loading ? (
              <p className="text-slate-500">데이터베이스 연결 중...</p>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {rooms.map(room => (
                  <div key={room.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-3">
                        <h3 className="text-xl font-bold">{room.room_number}호</h3>
                        <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                          room.status === 'vacant' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'
                        }`}>
                          {room.status === 'vacant' ? '공실' : '입주 중'}
                        </span>
                      </div>
                      <div className="text-sm text-slate-600 space-y-1 mb-4">
                        <p>보증금: <span className="font-semibold text-slate-900">{room.deposit}만원</span></p>
                        <p>월세/관리비: <span className="font-semibold text-slate-900">{room.rent}만 / {room.maintenance}만원</span></p>
                      </div>
                    </div>

                    {/* 공실일 때만 부동산 문자 전송 버튼 표시 */}
                    {room.status === 'vacant' && (
                      <button 
                        onClick={() => sendSmsToAgency(room)}
                        className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-2 transition"
                      >
                        <i data-lucide="send" className="w-4 h-4"></i> 부동산에 내놓기 (문자 발송)
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
